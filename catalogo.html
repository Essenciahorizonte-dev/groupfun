<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo — GROUPFUN</title>
<meta name="description" content="Catálogo GROUPFUN: escolhe cor, tamanho e quantidade e envia a encomenda pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="hd"></header>
<main class="wrap">
  <h1 class="page-t">Catálogo</h1>
  <div class="tools">
    <label class="f grow"><span>Pesquisar</span><input id="q" type="search" placeholder="Nome ou categoria" autocomplete="off"></label>
    <button id="open-cart" class="btn btn-ghost" type="button">Encomenda (<span id="cart-n">0</span>)</button>
  </div>
  <div id="chips" class="chips" role="group" aria-label="Filtrar por categoria" hidden></div>
  <div id="color-chips" class="chips color-filter" role="group" aria-label="Filtrar por cor" hidden></div>
  <p id="status" class="status" role="status">A carregar…</p>
  <div id="grid" class="grid"></div>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="cart" class="cart" aria-label="Resumo da encomenda" hidden>
  <div class="cart-h"><h2>Resumo da encomenda</h2><button id="close-cart" class="btn btn-ghost" type="button">Fechar</button></div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-f">
    <p class="total"><span>Total geral</span><strong id="cart-total">0 MT</strong></p>
    <p class="cart-note">Ao enviar, abre-se o WhatsApp da GROUPFUN com o resumo para confirmares disponibilidade e entrega.</p>
    <a id="send" class="btn btn-lg" href="#" target="_blank" rel="noopener" aria-disabled="true">Enviar encomenda pelo WhatsApp</a>
    <button id="clear" class="link" type="button">Limpar encomenda</button>
  </div>
</aside>

<footer id="site-footer" class="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
